<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRETACEOUS: TYRANT SURVIVAL</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07110d;color:#eef7e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}body{display:grid;place-items:center;height:100vh}.wrap{position:relative;width:min(1280px,100vw);height:min(720px,100vh);background:#182d20;box-shadow:0 0 60px #000}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;gap:10px;align-items:center;padding:16px 20px;background:linear-gradient(#06100dcc,transparent)}.logo{font-weight:900;letter-spacing:2px;font-size:22px}.era{opacity:.65;font-size:12px}.panel{position:absolute;background:#07120ee8;border:1px solid #a7c27c55;border-radius:12px;box-shadow:0 8px 24px #0006}.stats{left:18px;top:68px;width:270px;padding:14px}.name{font-size:19px;font-weight:800}.sub{font-size:11px;color:#aabda5}.bar{height:11px;border-radius:99px;background:#26362c;margin-top:7px;overflow:hidden}.fill{height:100%;transition:width .15s}.hp{background:#6fbd55}.st{background:#d3a94d}.row{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}.objective{right:18px;top:68px;width:250px;padding:14px}.objective b{display:block;font-size:13px;margin-bottom:7px}.objective span{font-size:12px;color:#b9c9b3;line-height:1.5}.controls{left:18px;bottom:18px;padding:10px 13px;font-size:12px;color:#d0dccb}.toast{left:50%;bottom:20px;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:#07120ee8;border:1px solid #a7c27c55;font-weight:700;opacity:0;transition:.25s}.toast.show{opacity:1}.start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#163a27cc,#020806ee)}.card{width:min(520px,90%);text-align:center;padding:36px;border:1px solid #a7c27c66;border-radius:18px;background:#08140ef2;box-shadow:0 20px 70px #000}.card h1{font-size:42px;letter-spacing:4px;margin:0 0 6px}.card p{color:#b9c9b3}.btn{pointer-events:auto;border:0;border-radius:10px;background:#b5d36a;color:#10200f;padding:13px 25px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.08)}.hide{display:none}</style></head><body><div class="wrap"><canvas id="game" width="1280" height="720"></canvas><div class="hud"><div class="top"><div class="logo">CRETACEOUS</div><div class="era">TYRANNOSAURUS SURVIVAL // 68 MYA</div></div><div class="panel stats"><div class="name">REX-01 · 티라노사우루스</div><div class="sub">성체 · 단독 생존</div><div class="row"><span>체력</span><b id="hpText">100 / 100</b></div><div class="bar"><div id="hp" class="fill hp" style="width:100%"></div></div><div class="row"><span>허기</span><b id="foodText">72%</b></div><div class="bar"><div id="food" class="fill st" style="width:72%"></div></div><div class="row"><span>생존 시간</span><b id="timeText">00:00</b></div></div><div class="panel objective"><b>오늘의 생존 목표</b><span id="objective">초식 공룡을 사냥해 허기를 채우고 경쟁자를 피하세요.</span></div><div class="panel controls">WASD 이동 · SHIFT 질주 · SPACE 포효 · 마우스 좌클릭 물기 · R 재시작</div><div id="toast" class="toast"></div></div><div id="start" class="start"><div class="card"><h1>CRETACEOUS</h1><p>백악기 생존 시뮬레이션</p><p>티라노사우루스가 되어 먹이를 찾고, 경쟁자를 피하고, 오래 살아남으세요.</p><button id="startBtn" class="btn">생존 시작</button></div></div></div><script src="game.js"></script></body></html>
